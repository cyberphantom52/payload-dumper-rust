[package]
name        = "payload_dumper"
version     = "0.8.4"
edition     = "2024"
authors     = ["rhythmcache"]
description = "A fast and efficient Android OTA payload dumper library and CLI"
repository  = "https://github.com/rhythmcache/payload-dumper-rust"
readme      = "README.md"
license     = "Apache-2.0"
homepage    = "https://github.com/rhythmcache/payload-dumper-rust"
keywords    = ["dumper", "android", "ota", "extractor", "payload"]
categories  = ["command-line-utilities", "filesystem", "compression"]

include = [
    "src/**",
    "include/**",
    "proto/update_metadata.proto",
    "LICENSE",
    "README.md",
    "Cargo.toml",
    "build.rs",
]

[lib]
name = "payload_dumper"
path = "src/lib.rs"

[[bin]]
name = "payload_dumper"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0"
indicatif = { version = "0.18", optional = true }
prost = "0.14"
num_cpus = { version = "1.17", optional = true }
hex = "0.4"
clap = { version = "4.6", features = ["derive"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
tokio = { version = "1.53", features = ["fs", "io-util", "rt", "time"] }
futures = "0.3"
async-compression = { version = "0.4", features = [
    "zstd",
    "xz",
    "bzip2",
    "tokio",
] }
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["io"], optional = true }
hickory-resolver = { version = "0.26", optional = true }
tempfile = { version = "3.27", optional = true }
ahash = "0.8"
hickory-proto = { version = "0.26", optional = true }
once_cell = { version = "1.21", optional = true }
futures-util = "0.3"
bsdiff-android = { version = "0.0.2", optional = true }
puffdiff = { version = "0.1", optional = true }
reqwest = { version = "0.13", features = [
    "rustls-no-provider", # Prevents pulling in aws-lc-rs dependencies
    "stream",
    "http2",
], default-features = false, optional = true }
rustls = { version = "0.23", features = [
    "ring",
], default-features = false, optional = true }
digest = { version = "0.11", optional = true }
sha2 = { version = "0.11", optional = true }
lz4diff = { version = "0.1", optional = true }
webpki-roots = { version = "1.0.11", optional = true }

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt"] }

[build-dependencies]
chrono      = "0.4"
prost-build = "0.14"

[features]
default = ["cli", "local_zip", "remote_zip", "prefetch", "diff_ota"]
cli = [
    "dep:clap",
    "dep:indicatif",
    "dep:num_cpus",
    "dep:serde_json",
    "dep:sha2",
    "dep:digest",
    "dep:once_cell",
    "tokio/macros",
    "tokio/rt-multi-thread",
    "tokio/sync",
    "tokio/io-std",
]
local_zip = []
remote_zip = ["local_zip", "dep:tokio-util", "dep:reqwest", "dep:rustls"]
hickory_dns = [
    "remote_zip",
    "dep:hickory-resolver",
    "dep:hickory-proto",
    "reqwest?/hickory-dns",
]
diff_ota = ["dep:bsdiff-android", "dep:puffdiff", "dep:lz4diff"]
prefetch = ["remote_zip", "dep:tempfile"]
android-webpki-roots = ["dep:webpki-roots"]

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = true
debug         = false
